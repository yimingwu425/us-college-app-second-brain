[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "college-brain"
version = "5.0.0"
description = "Local tools for a student-owned US college application second brain"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "numpy>=2,<3",
  "pydantic>=2.10,<3",
  "PyYAML>=6,<7",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
brain = "college_brain.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
college_brain = ["data/*.yaml", "data/vault/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
